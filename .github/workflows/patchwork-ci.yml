name: Patchwork CI

on:
  pull_request:
    paths:
      - '.github/workflows/patchwork-ci.yml'
      - 'patchwork/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/patchwork-ci.yml'
      - 'patchwork/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patchwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: patchwork/.nvmrc
          cache: npm
          cache-dependency-path: patchwork/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
